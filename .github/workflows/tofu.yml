name: OpenTofu

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1" # weekly drift check, Mondays
  workflow_dispatch:

permissions:
  contents: read

env:
  TOFU_VERSION: 1.13.2
  # module:var-file pairs, in apply order (repositories reads the Admins team from members)
  MODULES: members:org repositories:repositories

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      - run: |
          for pair in $MODULES; do
            m=${pair%%:*}
            tofu -chdir="$m" init -backend=false -input=false
            tofu -chdir="$m" validate
          done

  # PRs: plan and comment. Push to main: apply. Schedule/dispatch: plan and open an issue on drift.
  tofu:
    needs: check
    # Skipped until the GitHub App is configured. Fork PRs don't get secrets, so skip those too.
    if: >-
      vars.TOFU_APP_CLIENT_ID != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || '' }}
    concurrency:
      # Applies and drift checks share one queue; each PR gets its own, newest push wins.
      group: tofu-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TOFU_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOFU_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # TODO(#5): AWS credentials for the S3 state backend. Decision pending.

      - name: Plan
        id: plan
        if: github.event_name != 'push'
        env:
          TF_VAR_github_token: ${{ steps.app.outputs.token }}
        run: |
          changed=false
          for pair in $MODULES; do
            m=${pair%%:*}
            tofu -chdir="$m" init -input=false
            set +e
            tofu -chdir="$m" plan -input=false -no-color -detailed-exitcode -var-file="../${pair#*:}.tfvars" | tee "$m.plan.txt"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 1 ]; then exit 1; fi
            if [ "$code" -eq 2 ]; then changed=true; fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## OpenTofu plan"
            for pair in $MODULES; do
              m=${pair%%:*}
              printf '<details><summary><code>%s</code></summary>\n\n```\n' "$m"
              # ponytail: keeps the tail so the summary line survives; comments cap at 65536 chars
              tail -c 30000 "$m.plan.txt"
              printf '\n```\n</details>\n'
            done
          } > comment.md
          gh pr comment "$PR" --edit-last --create-if-none --body-file comment.md

      - name: Open drift issue
        if: github.event_name != 'pull_request' && github.event_name != 'push' && steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="OpenTofu drift detected"
          body="The scheduled plan found differences between GitHub and the config: $RUN_URL"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Apply
        if: github.event_name == 'push'
        env:
          TF_VAR_github_token: ${{ steps.app.outputs.token }}
        run: |
          for pair in $MODULES; do
            m=${pair%%:*}
            tofu -chdir="$m" init -input=false
            tofu -chdir="$m" apply -input=false -auto-approve -var-file="../${pair#*:}.tfvars"
          done
