name: zizmor

# No path filters: this is a required check, and a filtered-out required check blocks merging.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * 1" # weekly, so new audits catch existing workflows

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Annotations instead of SARIF: zizmor then fails the job on findings, which is what the required check needs.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0 # first version that understands actions.lock
          advanced-security: false
          annotations: true

  # Every action, direct or transitive, must match .github/workflows/actions.lock.
  # A new or changed workflow needs `gh actions-lock` re-run, or this fails.
  lockfile:
    runs-on: ubuntu-slim
    permissions: {}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
